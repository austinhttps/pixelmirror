name: windows_client_flutter
description: "Pixel Mirror Windows 11 Client - Production Flutter Desktop Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Windows 11 Fluent Design System
  fluent_ui: ^4.9.0
  flutter_acrylic: ^1.1.4
  window_manager: ^0.3.9

  # System Tray Integration
  tray_manager: ^0.2.3

  # Cryptography (256-bit AES-GCM conforming to API_CONTRACT.md)
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # Windows Native Notifications & Drag-and-Drop
  local_notifier: ^0.1.6
  desktop_drop: ^0.4.4

  # mDNS Auto-Discovery
  multicast_dns: ^0.3.2+6

  # State Management & Helpers
  provider: ^6.1.2
  path: ^1.9.0
  path_provider: ^2.1.2
  win32: ^5.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/
